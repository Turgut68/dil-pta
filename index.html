<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f1">
<meta name="color-scheme" content="light">
<title>Dil’s PTA-Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dil’s PTA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<style>
:root{
  --bg:#f4f5f1; --card:#fff; --ink:#1b2622; --muted:#5d6b66; --line:#e2e6e1;
  --accent:#0f5f58; --accent2:#e7f2ef; --ok:#17803d; --okbg:#e8f5ec; --bad:#b4232a; --badbg:#fbeaea;
  --warn:#8a5a00; --warnbg:#fff4dc; --r:16px;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:20px;margin:4px 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,label.btn,.flip,nav button{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid #1d6fa3;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mode{background:var(--card);border:0;border-radius:var(--r);padding:16px;text-align:left;font:inherit;color:inherit;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;min-height:112px;transition:transform 120ms ease-out}
.mode:active{transform:scale(.97)}
.mode b{display:block;font-size:16px;margin:6px 0 2px}
.mode span{font-size:13px;color:var(--muted)}
.mode .ic{font-size:26px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;min-height:50px;font-family:inherit;font-size:16px;font-weight:600;line-height:1.2;background:var(--accent);color:#fff;cursor:pointer;margin-top:8px;transition:transform 120ms ease-out,filter 120ms}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.sec{background:var(--accent2);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}.row>.btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chip{border:1.5px solid #c9d0ca;background:var(--card);border-radius:999px;padding:10px 14px;min-height:44px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;transition:transform 100ms ease-out}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bubble{background:var(--card);border-radius:4px 18px 18px 18px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06);margin:6px 0 14px;font-size:17px}
.who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:#dfe9e6;display:grid;place-items:center;font-size:16px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid #c9d0ca;background:var(--card);border-radius:12px;padding:13px 14px;min-height:50px;margin:0 0 8px;font:inherit;color:inherit;cursor:pointer;transition:transform 100ms ease-out,background 100ms}
.opt:not([disabled]):active{transform:scale(.98);background:#eef2ef}
.opt[disabled]{cursor:default;color:inherit;opacity:1}
.opt .mk{font-weight:700;margin-right:6px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt .why{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.fb{border-radius:var(--r);padding:14px 16px;margin:12px 0}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
.fb b{display:block;margin-bottom:4px}
ul.clean{margin:0;padding-left:20px} ul.clean li{margin:3px 0}
.box{border-radius:12px;padding:12px 14px;margin-top:10px}
.box.tip{background:var(--accent2)} .box.doc{background:var(--warnbg)} .box.warn{background:#fdecec}
.why2{border-top:1px solid rgba(0,0,0,.08);padding:2px 0}.why2:first-of-type{border-top:0}
.why2 summary{cursor:pointer;font-weight:600;padding:10px 0;min-height:44px;list-style:none;display:flex;gap:8px;align-items:flex-start}
.why2 summary::-webkit-details-marker{display:none}
.why2 summary::before{content:"▸";color:var(--bad);flex:none}.why2[open] summary::before{content:"▾"}
.why2 p{margin:0 0 10px 18px;font-size:15px}
.box h3{color:inherit;opacity:.8}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.toggle{background:none;border:0;color:var(--accent);font-family:inherit;font-size:15px;font-weight:600;padding:10px 0;min-height:44px;cursor:pointer}
.pimg{width:100%;aspect-ratio:4/3;border-radius:12px;object-fit:cover;background:#e9eeec;display:block}
.ph{width:100%;aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;text-align:center;padding:16px;color:#fff;font-weight:700;font-size:22px;line-height:1.2}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.thumbph{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:15px}
.list .item{display:flex;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:64px}
.list .item:active{background:#f0f3f1}
.list .item:last-child{border-bottom:0}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--muted)}
input[type=text],input[type=search],textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.flip{perspective:1200px;cursor:pointer}
.flip .inner{position:relative;transition:transform .45s;transform-style:preserve-3d;min-height:430px}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:auto;overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}
.answer{background:#fff7e6;border-radius:4px 18px 18px 18px;padding:12px 14px;margin:10px 0 0}
.back{transform:rotateY(180deg)}
.kv{margin:0 0 10px}.kv b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.stat{display:flex;justify-content:space-between;gap:10px}
.stat div{flex:1;text-align:center;background:var(--card);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;min-height:48px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.tag{display:inline-block;font-size:12px;background:var(--accent2);color:var(--accent);border-radius:6px;padding:2px 8px;margin-bottom:6px;font-weight:600}
.center{text-align:center}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b2622;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
</style>
</head>

/* ===== „Wann nicht – und warum?“ – einfache Begründungen ===== */
const W = {
 nsarBlut:["Blutungsneigung oder Blutverdünner (z. B. Xarelto, Eliquis, Marcumar, ASS 100)","Ibuprofen & Co. machen die Blutplättchen weniger „klebrig“ – Wunden schließen sich langsamer. Gleichzeitig reizen sie den Magen. Wer sowieso leicht blutet oder Blutverdünner nimmt, bekommt dadurch schneller Blutungen, z. B. im Magen."],
 nsarMagen:["Magengeschwür oder Magenblutung (auch früher)","Ibuprofen & Co. bremsen Botenstoffe (Prostaglandine), die normalerweise eine Schutzschicht im Magen bilden. Ohne diesen Schutz greift die Magensäure die Schleimhaut an – ein Geschwür kann wieder aufbrechen oder bluten."],
 nsarAsthma:["Asthma","Bei manchen Asthmatikern kippt durch das Schmerzmittel das Gleichgewicht der Botenstoffe: Es entstehen mehr Stoffe, die die Bronchien eng machen – ein Asthmaanfall kann ausgelöst werden („Schmerzmittel-Asthma“)."],
 nsarSchwanger:["Letztes Schwangerschaftsdrittel (ab ca. 28. Woche)","Beim Baby kann sich ein wichtiges Blutgefäß am Herzen zu früh schließen und die Nieren des Kindes werden schlechter durchblutet. Außerdem kann sich die Geburt verzögern."],
 nsarNiere:["Nierenerkrankung, Herzschwäche, Bluthochdruck","Ibuprofen & Co. lassen den Körper Salz und Wasser zurückhalten und drosseln die Nierendurchblutung. Dadurch steigt der Blutdruck, das Herz wird belastet und kranke Nieren werden schlechter. Blutdrucksenker wirken schwächer."],
 nsarAss100:["Gleichzeitig ASS 100 zum Herzschutz","Ibuprofen kann ASS 100 an den Blutplättchen „den Platz wegnehmen“ – der Herzschutz wird schwächer. Deshalb ASS 100 mindestens 30 Min. vor Ibuprofen nehmen und Ibuprofen nur kurz."],
 paraLeber:["Lebererkrankung, regelmäßig Alkohol, zu hohe Dosis","Paracetamol wird in der Leber abgebaut. Bei zu viel entsteht ein giftiges Abbauprodukt, das die Leber nicht mehr unschädlich machen kann. Alkohol belastet die Leber zusätzlich – das verstärkt die Gefahr."],
 paraDoppelt:["Andere paracetamolhaltige Mittel (Grippostad C, MediNait, Thomapyrin)","Viele Kombipräparate enthalten „versteckt“ Paracetamol. Nimmt man mehrere davon, addiert sich die Menge unbemerkt über die Tageshöchstmenge – Gefahr für die Leber."],
 assKind:["Kinder und Jugendliche unter 12 (mit Virusinfekt)","Bei Kindern mit Virusinfekt (z. B. Grippe, Windpocken) kann ASS das seltene, aber lebensgefährliche Reye-Syndrom auslösen – dabei werden Leber und Gehirn geschädigt."],
 assBlut:["Blutungsneigung, Blutverdünner, bevorstehende OP oder Zahn-OP","ASS blockiert die Blutplättchen dauerhaft – für ihre ganze Lebensdauer von ca. 7–10 Tagen. So lange blutet man bei Verletzungen oder Eingriffen stärker."],
 ass100Schmerz:["Als Schmerzmittel","100 mg sind viel zu wenig gegen Schmerzen (dafür braucht man 500–1.000 mg). Die kleine Dosis wirkt nur auf die Blutplättchen – deshalb hilft sie gegen Herzinfarkt, aber nicht gegen Kopfweh."],
 ass100Absetzen:["Eigenmächtig absetzen","Ohne ASS verklumpen die Blutplättchen wieder normal – bei jemandem nach Herzinfarkt oder Stent steigt dann sofort das Risiko für einen neuen Infarkt oder Schlaganfall."],
 pseBlutdruck:["Bluthochdruck, Herzerkrankung","Pseudoephedrin macht nicht nur die Gefäße in der Nase eng, sondern im ganzen Körper. Dadurch steigen Blutdruck und Puls – gefährlich für ein krankes Herz."],
 pseSchild:["Schilddrüsenüberfunktion","Bei einer Überfunktion läuft der Körper schon „auf Hochtouren“ (Herzrasen, Unruhe). Pseudoephedrin treibt Herz und Kreislauf zusätzlich an."],
 antiGlaukom:["Grüner Star (Engwinkelglaukom) oder vergrößerte Prostata","Diese Wirkstoffe bremsen nebenbei einen Botenstoff (anticholinerg): Die Pupille wird weit und kann den Abfluss im Auge verstopfen – der Augeninnendruck steigt. Der Blasenmuskel wird schwächer – mit großer Prostata kann man dann plötzlich kein Wasser mehr lassen."],
 antiAlter:["Ältere Menschen","Ältere bauen die Wirkstoffe langsamer ab. Sie sind morgens noch benommen und schwindelig – nachts auf dem Weg zur Toilette steigt die Sturzgefahr, es kann Verwirrtheit auftreten."],
 antiAlkohol:["Alkohol, Autofahren","Alkohol und das Mittel machen beide müde – zusammen verstärkt sich das stark. Die Reaktion ist auch am nächsten Morgen noch langsamer."],
 xyloLang:["Länger als 7 Tage","Die Nasenschleimhaut gewöhnt sich an das Spray. Lässt die Wirkung nach, schwillt sie stärker an als vorher – man sprüht immer öfter (Teufelskreis, „Nasenspray-Sucht“)."],
 dexSsri:["Antidepressiva (z. B. Citalopram, Sertralin, MAO-Hemmer)","Dextromethorphan und viele Antidepressiva erhöhen beide den Botenstoff Serotonin. Zusammen kann zu viel davon entstehen (Serotonin-Syndrom: Unruhe, Schwitzen, Herzrasen, Fieber)."],
 hustenKombi:["Gleichzeitig Schleimlöser und Hustenstiller","Der Schleimlöser macht den Schleim flüssig, der Hustenstiller verhindert das Abhusten. Der Schleim bleibt in den Bronchien liegen – Bakterien können sich dort vermehren."],
 accAntibiotika:["Gleichzeitige Einnahme mit bestimmten Antibiotika","Acetylcystein kann manche Antibiotika im Magen-Darm abschwächen. Mit 2 Stunden Abstand stören sie sich nicht."],
 schleimAbend:["Spät abends einnehmen","Der Schleim löst sich erst nach einiger Zeit – dann muss man husten. Wer das Mittel spät abends nimmt, hustet nachts und schläft schlecht."],
 ginkgoBlut:["Blutverdünner, bevorstehende OP","Ginkgo hemmt leicht das Verklumpen der Blutplättchen. Zusammen mit Blutverdünnern addiert sich das – die Blutungsgefahr steigt."],
 triptanHerz:["Herzerkrankung, Bluthochdruck, Schlaganfall früher","Triptane verengen Blutgefäße – das hilft im Kopf gegen Migräne, betrifft aber auch die Herzgefäße. Bei krankem Herz kann das zu Durchblutungsstörungen bis zum Infarkt führen."],
 triptanAlter:["Unter 18, über 65, Migräne nicht ärztlich bestätigt","Bei Jüngeren und Älteren ist das Risiko nicht genug untersucht bzw. Herzprobleme sind häufiger. Und ohne Diagnose könnte hinter den Kopfschmerzen etwas Ernstes stecken, das ein Arzt ausschließen muss."],
 baerSchwanger:["Schwangerschaft, Stillzeit, Kinder unter 12, länger als 1 Woche","Bärentraube enthält Arbutin, aus dem im Körper Hydrochinon wird. Das wirkt gegen Bakterien, ist in größeren Mengen aber bedenklich. Für Ungeborene, Säuglinge und Kinder ist es nicht ausreichend untersucht – deshalb nur kurz und nicht bei ihnen."],
 blaseFieber:["Fieber, Flankenschmerz, Blut im Urin","Das spricht dafür, dass die Entzündung zu den Nieren hochgestiegen ist. Das braucht ein Antibiotikum vom Arzt – Pflanzenmittel reichen nicht."],
 durchspuelOedem:["Wassereinlagerungen durch Herz- oder Nierenschwäche","Durchspülungsmittel sollen mit viel Trinken die Harnwege spülen. Ein schwaches Herz bzw. kranke Nieren schaffen die große Flüssigkeitsmenge nicht – das Wasser lagert sich im Körper ein."],
 pilzErst:["Erste Pilzinfektion, Schwangerschaft, ungewöhnlicher Ausfluss","Juckreiz und Ausfluss können auch von Bakterien oder Geschlechtskrankheiten kommen – die sehen ähnlich aus, brauchen aber eine andere Behandlung. Das muss beim ersten Mal ein Arzt unterscheiden."],
 pilzDiabetes:["Diabetes","Diabetiker spüren Verletzungen an den Füßen oft schlecht und Wunden heilen schlechter. Aus einem kleinen Pilzriss kann eine schwere Infektion werden (diabetischer Fuß) – deshalb zum Arzt."],
 nagelWurzel:["Nagelwurzel befallen oder viele Nägel","Der Lack kommt nicht tief genug an die Nagelwurzel, wo der Nagel nachwächst. Dann braucht es meist Tabletten vom Arzt."],
 kortisonInfekt:["Infizierte Haut (Pilz, Herpes, Akne), großflächig, Kinder unter 6","Kortison dämpft die Abwehr der Haut – Pilze, Bakterien und Viren können sich besser ausbreiten. Großflächig oder bei kleinen Kindern gelangt außerdem mehr Kortison in den Körper, und die Haut kann dünner werden."],
 loperFieber:["Fieber oder Blut im Stuhl","Das spricht für eine Infektion mit Bakterien. Durchfall ist dann ein Schutz: Der Körper spült die Erreger aus. Loperamid legt den Darm still – die Erreger bleiben drin und die Infektion kann schlimmer werden."],
 loperKind:["Kinder unter 12","Kinder reagieren empfindlicher: Der Darm kann zu stark gelähmt werden, und Loperamid kann bei ihnen ins Gehirn gelangen (Benommenheit, Atemprobleme)."],
 ppiLang:["Länger als 14 Tage, Schluckbeschwerden, Gewichtsverlust","Hinter anhaltendem Sodbrennen können ernste Ursachen stecken (Geschwür, Entzündung der Speiseröhre, selten Krebs). Das Mittel würde sie nur überdecken."],
 antazidaAbstand:["Gleichzeitig mit anderen Medikamenten","Säurebinder „fangen“ im Magen auch andere Wirkstoffe ab (z. B. Antibiotika, Eisen, Schilddrüsenhormon) – die kommen dann schlechter ins Blut und wirken schwächer."],
 bisaMilch:["Zusammen mit Milch oder Säurebindern","Die Tablette hat einen Schutzüberzug, der sich erst im Darm auflösen soll. Milch und Säurebinder machen den Magen weniger sauer – der Überzug löst sich zu früh im Magen und reizt ihn."],
 bisaDauer:["Dauerhafte Einnahme","Der Darm wird „faul“ und verliert über den Stuhl viel Kalium. Kaliummangel macht den Darm noch träger – ein Teufelskreis."],
 mediAlkohol:["Kinder, Schwangere, Alkoholkranke, Autofahren","MediNait enthält Alkohol und macht stark müde. Für Kinder und Ungeborene ist Alkohol schädlich, bei Alkoholkranken kann er einen Rückfall auslösen."],
 oeleKind:["Säuglinge und Kleinkinder","Menthol, Campher und Eukalyptus können bei kleinen Kindern einen Krampf des Kehlkopfs auslösen – sie bekommen plötzlich keine Luft."],
 brauseNatrium:["Bluthochdruck, salzarme Diät","Brausetabletten enthalten viel Natrium (Salz) für das Sprudeln. Salz kann den Blutdruck erhöhen."],
 coffeinAbend:["Spät abends, Herzrasen","Das enthaltene Coffein macht wach und kann den Puls erhöhen – man schläft schlechter."],
 kopfschmerzOft:["Mehr als 10 Tage im Monat","Wer zu oft Kopfschmerzmittel nimmt, bekommt davon selbst Kopfschmerzen (Schmerzmittel-Kopfschmerz) – ein Teufelskreis."],
 venenThrombose:["Plötzlich einseitig geschwollenes, schmerzendes, warmes Bein","Das kann ein Blutgerinnsel (Thrombose) sein. Löst es sich, kann es in die Lunge wandern (Lungenembolie) – Notfall, kein Fall für Venentabletten."],
 kreislaufOhnmacht:["Ohnmacht, Herzrasen, Brustschmerz","Das kann vom Herzen kommen (z. B. Rhythmusstörungen) und muss ärztlich abgeklärt werden – Kreislauftropfen würden das nur überdecken."],
 korodinAlkohol:["Kinder, Alkoholkranke","Die Tropfen enthalten Alkohol."],
 melatSchwanger:["Schwangerschaft, Stillzeit, Kinder","Melatonin ist ein Hormon. Wie es auf Ungeborene, Säuglinge und die Entwicklung von Kindern wirkt, ist nicht ausreichend untersucht."],
 schlaf2Wochen:["Länger als 2 Wochen","Der Körper gewöhnt sich, die Wirkung lässt nach. Außerdem sollte man klären, was hinter anhaltenden Schlafproblemen steckt (z. B. Depression, Schlafapnoe)."],
 dicl14:["Unter 14 Jahren","Für jüngere Kinder ist die Dosis zu hoch bzw. nicht ausreichend untersucht – für Kinder gibt es eigene Präparate (z. B. Ibuprofen-Saft, Kytta Schmerzsalbe ab 3)."],
 gelWunde:["Offene Wunden, Schleimhäute, Augen","Über offene Haut gelangt viel mehr Wirkstoff in den Körper, außerdem brennt es und die Wunde heilt schlechter."],
 benzocainAllergie:["Allergie gegen Benzocain / „Para-Stoffe“, kleine Kinder","Benzocain kann Allergien auslösen. Bei kleinen Kindern kann die Betäubung im Rachen das Schlucken stören (Verschlucken)."],
 heiserLang:["Heiserkeit länger als 3 Wochen","Dahinter kann eine Veränderung an den Stimmbändern stecken (bei Rauchern auch Kehlkopfkrebs) – das muss ein HNO-Arzt anschauen."]

/* ============ SPEICHER ============ */
const KEY="pta_trainer_v1";
let S={res:{},cards:{},photos:{},eigene:[]};
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast("Speicher voll – Foto evtl. nicht gespeichert");return false}}
load();

const allProd=()=>PRODUKTE.concat(S.eigene||[]);
const prodById=id=>allProd().find(p=>p.id===id);
let nurRegal=true;
const fallRegal=c=>{const o=c.opts.find(x=>x.ok);const p=o&&o.pid?prodById(o.pid):null;return p?p.regal!==false:true};
const prodRegal=p=>p.regal!==false;
function regalChip(fn){return `<div class="chips"><button class="chip ${nurRegal?"on":""}" aria-pressed="${nurRegal}" onclick="nurRegal=true;${fn}()">🏪 Unsere Sichtwahl</button><button class="chip ${!nurRegal?"on":""}" aria-pressed="${!nurRegal}" onclick="nurRegal=false;${fn}()">Alles (inkl. weitere Klassiker)</button></div>`}
function rec(key,ok){const r=S.res[key]||{r:0,f:0,last:null};ok?r.r++:r.f++;r.last=ok;S.res[key]=r;save();}

/* ============ HELFER ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function initials(p){return (p.marke||p.name).split(/[\s\/]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function img(p,cls){
  const ph=S.photos[p.id]||BILD[p.id];
  if(ph) return `<img class="${cls==="thumb"?"thumb":"pimg"}" src="${ph}" alt="${cls==="thumb"?"":"Packung "+esc(p.marke)}">`;
  const col=KATCOL[p.kat]||KATCOL.eigen;
  if(cls==="thumb") return `<div class="thumbph" aria-hidden="true" style="background:${col}">${esc(initials(p))}</div>`;
  return `<div class="ph" style="background:linear-gradient(135deg,${col},${col}cc)"><div>${esc(p.marke||p.name)}<div style="font-size:13px;font-weight:500;opacity:.85;margin-top:6px">Noch kein Foto – unter „Produkte“ hinzufügen</div></div></div>`;
}

/* ============ NAVIGATION ============ */
const TABS=[["start","🏠","Start"],["beraten","💬","Beraten"],["quiz","❓","Quiz"],["karten","🗂️","Karten"],["produkte","💊","Produkte"]];
let tab="start";
function go(t){tab=t;try{history.replaceState(null,"","#"+t)}catch(e){}renderNav();R[t]();window.scrollTo(0,0)}

let F=null; let fKat="alle";
R.beraten=()=>{
  if(F&&F.i<F.list.length) return renderFall();
  const counts=k=>FAELLE.filter(x=>(k==="alle"||x.kat===k)&&(!nurRegal||fallRegal(x))).length;
  if(fKat!=="alle"&&!counts(fKat))fKat="alle";
  $("#app").innerHTML=`
  <h2>Kundengespräch</h2>
  <p class="muted">Ein Kunde steht vor dir. Überleg dir zuerst, was du nachfragen würdest – dann wähle deine Empfehlung.</p>
  ${regalChip("R.beraten")}
  <h3 style="margin-top:6px">Bereich</h3>
  <div class="chips">
    <button class="chip ${fKat==="alle"?"on":""}" onclick="fKat='alle';R.beraten()">Alle (${counts("alle")})</button>
    ${Object.entries(KAT).filter(([k])=>counts(k)).map(([k,v])=>`<button class="chip ${fKat===k?"on":""}" onclick="fKat='${k}';R.beraten()">${v} (${counts(k)})</button>`).join("")}

function startFaelle(mode){
  let pool=FAELLE.filter(x=>(fKat==="alle"||x.kat===fKat)&&(!nurRegal||fallRegal(x)));
  if(mode==="fehler"){pool=FAELLE.filter(x=>S.res["f:"+x.id]&&S.res["f:"+x.id].last===false);}
  pool=shuffle(pool); if(mode==="normal")pool=pool.slice(0,8);
  if(!pool.length){toast("Keine Fälle gefunden");return}
  F={list:pool,i:0,ok:0,opts:null,answered:null,showQ:false};
  if(tab!=="beraten"){tab="beraten";renderNav()}
  renderFall();
}
function renderFall(){
  const c=F.list[F.i];
  if(!F.opts)F.opts=shuffle(c.opts.map((o,k)=>({...o,k})));
  const a=F.answered;
  const chosen=a!=null?F.opts[a]:null;
  const best=c.opts.find(o=>o.ok);
  const bp=best.pid?prodById(best.pid):null;
  $("#app").innerHTML=`
  <div class="row" style="align-items:center;justify-content:space-between"><span class="small muted">Fall ${F.i+1} von ${F.list.length} · ${KAT[c.kat]}</span><button class="toggle small" onclick="F=null;R.beraten()">Beenden</button></div>
  <div class="progress" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="${F.list.length}" aria-valuenow="${F.i}"><i style="width:${(F.i)/F.list.length*100}%"></i></div>
  <div class="who"><span class="avatar" aria-hidden="true">🧑</span>${esc(c.wer)}</div>
  <div class="bubble">${esc(c.text)}</div>
  <div class="step"><i>1</i>Rückfragen stellen</div>
  ${F.showQ?`<div class="card"><p class="small muted" style="margin-bottom:6px">Das solltest du fragen:</p><ul class="clean">${c.rueck.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>${c.info?`<div class="answer"><b>Kunde antwortet:</b> ${esc(c.info)}</div>`:""}</div>`
   :`<p class="small muted">Überleg dir zuerst, was du wissen musst – dann deck auf, was du hättest fragen sollen und was der Kunde antwortet.</p><button class="btn sec" onclick="F.showQ=true;renderFall();focusSel('.answer,.step+.card')">Fragen stellen &amp; Antwort hören</button>`}
  ${F.showQ?`<div class="step"><i>2</i>Was empfiehlst du?</div>
  ${F.opts.map((o,i)=>{
     let cls="",mk="";if(a!=null){if(o.ok){cls="ok";mk="✓"}else if(i===a){cls="bad";mk="✗"}}
     return `<button class="opt ${cls}" ${a!=null?"disabled":""} onclick="answerFall(${i})">${mk?`<span class="mk" aria-hidden="true">${mk}</span>`:""}${esc(o.t)}${o.ok&&a!=null?'<span class="sr"> – richtige Antwort</span>':""}${a!=null&&!o.ok&&i===a&&o.w?`<span class="why">${esc(o.w)}</span>`:""}</button>`}).join("")}`:""}
  ${a!=null?`
   <div class="fb ${chosen.ok?"ok":"bad"}" id="fb" tabindex="-1"><b>${chosen.ok?"✅ Richtig!":"❌ Nicht ganz."}</b>${esc(c.erkl)}</div>
   ${bp?`<button class="card opt" style="display:flex;gap:12px;align-items:center" onclick="openProd('${bp.id}')">${img(bp,"thumb")}<span><b style="display:block">${esc(bp.marke)}</b><span class="small muted">${esc(bp.wirkstoff)} · ${esc(bp.dosKurz||"")} – antippen für Details</span></span></button>`:""}
   <div class="box tip"><h3>Das gibst du noch mit</h3><ul class="clean">${c.tipps.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
   <div class="box doc"><h3>Ab zum Arzt, wenn …</h3><ul class="clean">${c.arzt.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
   <button class="btn" onclick="nextFall()">${F.i+1<F.list.length?"Nächster Kunde →":"Auswertung ansehen"}</button>`:""}
  `;
}
function answerFall(i){if(F.answered!=null)return;F.answered=i;const ok=!!F.opts[i].ok;if(ok)F.ok++;rec("f:"+F.list[F.i].id,ok);renderFall();toFb();}
function toFb(){const f=$("#fb");if(!f)return;const t=document.querySelectorAll(".step")[1]||f;const y=t.getBoundingClientRect().top+scrollY-12;scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});f.focus({preventScroll:true})}
function focusSel(q){const e=document.querySelector(q);if(e){e.setAttribute("tabindex","-1");e.focus({preventScroll:true})}}
function nextFall(){
  F.i++;F.opts=null;F.answered=null;F.showQ=false;
  if(F.i>=F.list.length){
    const n=F.list.length,ok=F.ok;
    $("#app").innerHTML=`<div class="card center" style="margin-top:20px"><p class="muted">Geschafft!</p><div class="big">${ok}/${n}</div><p>${ok===n?"Perfekt beraten! 🎉":ok>=n*0.7?"Sehr gut – fast alles richtig.":"Weiter üben – die falschen kannst du gezielt wiederholen."}</p></div>
    <button class="btn" onclick="F=null;startFaelle('normal')">Neue Runde</button>
    ${ok<n?`<button class="btn sec" onclick="F=null;startFaelle('fehler')">Falsche wiederholen</button>`:""}
    <button class="btn ghost" onclick="F=null;go('start')">Zur Startseite</button>`;
    F=null;window.scrollTo(0,0);return;
  }
  renderFall();window.scrollTo(0,0);
}

/* ---------- PRODUKT-QUIZ ---------- */
let Q=null;
const QTYPES=[
 {k:"wirkstoff",frage:p=>`Welcher Wirkstoff steckt in <b>${esc(p.marke)}</b>?`,ans:p=>p.wirkstoff,same:(a,b)=>false},
 {k:"kurz",frage:p=>`Wofür setzt man <b>${esc(p.marke)}</b> ein?`,ans:p=>p.kurz,same:(a,b)=>a.kat===b.kat},
 {k:"dosKurz",frage:p=>`Wie wird <b>${esc(p.marke)}</b> angewendet?`,ans:p=>p.dosKurz,same:(a,b)=>false},
 {k:"quiz",frage:p=>`Welcher Beratungshinweis gehört zu <b>${esc(p.marke)}</b>?`,ans:p=>p.quiz,same:(a,b)=>a.gruppe===b.gruppe},
 {k:"gruppe",frage:p=>`Zu welcher Wirkstoffgruppe gehört <b>${esc(p.marke)}</b>?`,ans:p=>p.gruppe,same:(a,b)=>a.gruppe===b.gruppe}
];
const base=p=>(p.wirkstoff||"").toLowerCase().split(/[\s(+,]/)[0];
const sameBase=(a,b)=>{const x=base(a),y=base(b);return x&&y&&(x===y||x.startsWith(y)||y.startsWith(x))};
function makeWarum(p){
  const x=p.warum[Math.floor(Math.random()*p.warum.length)];
  const own=new Set(p.warum.map(y=>y.k));
  const pool=shuffle(Object.keys(W).filter(k=>!own.has(k)&&W[k][1]!==x.warum)).slice(0,3).map(k=>({t:W[k][1]}));
  return {p,t:{k:"warum"},frage:`Warum sollte man <b>${esc(p.marke)}</b> bei <b>${esc(x.wenn)}</b> nicht (oder nur nach Rücksprache) geben?`,opts:shuffle([{t:x.warum,ok:true},...pool])};
}
function makeQuestion(p){
  if(p.warum&&p.warum.length&&Math.random()<0.35)return makeWarum(p);
  const types=shuffle(QTYPES).filter(t=>p[t.k]);
  for(const t of types){
    const others=shuffle(allProd().filter(o=>o.id!==p.id&&o[t.k]&&!t.same(p,o)&&!sameBase(p,o)&&t.ans(o)!==t.ans(p)));
    const uniq=[];for(const o of others){if(!uniq.includes(t.ans(o)))uniq.push(t.ans(o));if(uniq.length===3)break;}
    if(uniq.length<3)continue;
    return {p,t,frage:t.frage(p),opts:shuffle([{t:t.ans(p),ok:true},...uniq.map(x=>({t:x}))])};
  }
  return null;
}
let qKat="alle";
R.quiz=()=>{
  if(Q&&Q.i<Q.n) return renderQ();
  const counts=k=>allProd().filter(p=>(k==="alle"||p.kat===k)&&(!nurRegal||prodRegal(p))).length;
  if(qKat!=="alle"&&!counts(qKat))qKat="alle";
  $("#app").innerHTML=`<h2>Produkt-Quiz</h2>
  <p class="muted">Du siehst ein Produkt aus dem Regal und bekommst eine Frage dazu.</p>
  ${regalChip("R.quiz")}
  <h3 style="margin-top:6px">Bereich</h3>
  <div class="chips">
   <button class="chip ${qKat==="alle"?"on":""}" onclick="qKat='alle';R.quiz()">Alle (${counts("alle")})</button>
   ${Object.entries(KAT).concat([["eigen","Eigene"]]).filter(([k])=>counts(k)).map(([k,v])=>`<button class="chip ${qKat===k?"on":""}" onclick="qKat='${k}';R.quiz()">${v} (${counts(k)})</button>`).join("")}
  </div>
  <button class="btn" onclick="startQuiz(10)">10 Fragen starten</button>
  <button class="btn ghost" onclick="startQuiz(20)">20 Fragen</button>`;
};
function startQuiz(n){
  const pool=allProd().filter(p=>(qKat==="alle"||p.kat===qKat)&&(!nurRegal||prodRegal(p)));
  if(!pool.length){toast("Keine Produkte im Bereich");return}
  const qs=[];let guard=0;
  while(qs.length<n&&guard<n*6){guard++;const p=pool[Math.floor(Math.random()*pool.length)];
    if(qs.length&&qs[qs.length-1].p.id===p.id&&pool.length>1)continue;
    const q=makeQuestion(p);if(q)qs.push(q);}
  if(!qs.length){toast("Zu wenig Daten für Fragen");return}
  Q={qs,i:0,n:qs.length,ok:0,a:null};renderQ();
}
function renderQ(){
  const q=Q.qs[Q.i],p=q.p,a=Q.a;
  $("#app").innerHTML=`
  <div class="row" style="align-items:center;justify-content:space-between"><span class="small muted">Frage ${Q.i+1} von ${Q.n}</span><button class="toggle small" onclick="Q=null;R.quiz()">Beenden</button></div>
  <div class="progress" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="${Q.n}" aria-valuenow="${Q.i}"><i style="width:${Q.i/Q.n*100}%"></i></div>
  ${img(p)}
  <p style="font-size:18px;margin:14px 0 12px">${q.frage}</p>
  ${q.opts.map((o,i)=>{let cls="",mk="";if(a!=null){if(o.ok){cls="ok";mk="✓"}else if(i===a){cls="bad";mk="✗"}}
     return `<button class="opt ${cls}" ${a!=null?"disabled":""} onclick="answerQ(${i})">${mk?`<span class="mk" aria-hidden="true">${mk}</span>`:""}${esc(o.t)}${o.ok&&a!=null?'<span class="sr"> – richtige Antwort</span>':""}</button>`}).join("")}
  ${a!=null?`<div class="fb ${q.opts[a].ok?"ok":"bad"}" id="fb" tabindex="-1"><b>${q.opts[a].ok?"✅ Richtig!":"❌ Leider falsch."}</b>
     <span class="small">${esc(p.marke)} · ${esc(p.wirkstoff)}<br>${esc(p.anwendung||p.kurz||"")}</span></div>
     <button class="toggle" onclick="openProd('${p.id}')">Ganzes Produkt ansehen →</button>
     <button class="btn" onclick="nextQ()">${Q.i+1<Q.n?"Weiter →":"Auswertung"}</button>`:""}`;
}
function answerQ(i){if(Q.a!=null)return;Q.a=i;const ok=!!Q.qs[Q.i].opts[i].ok;if(ok)Q.ok++;rec("p:"+Q.qs[Q.i].p.id,ok);if(!ok)S.cards[Q.qs[Q.i].p.id]=0,save();renderQ();toFb();}
function nextQ(){Q.i++;Q.a=null;
  if(Q.i>=Q.n){const {ok,n}=Q;Q=null;
    $("#app").innerHTML=`<div class="card center" style="margin-top:20px"><p class="muted">Quiz beendet</p><div class="big">${ok}/${n}</div><p>${ok===n?"Alles richtig! 🎉":"Falsch beantwortete Produkte landen wieder vorne bei den Lernkarten."}</p></div>
    <button class="btn" onclick="startQuiz(${n})">Noch eine Runde</button><button class="btn sec" onclick="go('karten')">Zu den Lernkarten</button>`;
    window.scrollTo(0,0);return}
  renderQ();window.scrollTo(0,0);}

/* ---------- LERNKARTEN ---------- */
let K=null;
R.karten=()=>{
  const ps=allProd().filter(p=>!nurRegal||prodRegal(p));
  const order=shuffle(ps).sort((a,b)=>(S.cards[a.id]||0)-(S.cards[b.id]||0));
  K={list:order,i:0,flip:false};renderK();
};
function renderK(){
  const ps=allProd().filter(p=>!nurRegal||prodRegal(p));const known=ps.filter(p=>(S.cards[p.id]||0)>=2).length;
  const p=K.list[K.i];
  if(!p){$("#app").innerHTML=`<div class="card center"><p>Keine Karten.</p></div>`;return}
  const lvl=S.cards[p.id]||0;
  $("#app").innerHTML=`
  <div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Lernkarten</h2><span class="small muted">${known}/${ps.length} sicher</span></div>
  ${regalChip("R.karten")}
  <div class="progress"><i style="width:${known/ps.length*100}%"></i></div>
  <div class="flip ${K.flip?"on":""}" role="button" tabindex="0" aria-pressed="${K.flip}" aria-label="Karte ${esc(p.marke)} umdrehen" onclick="flipK()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipK()}">
   <div class="inner">
    <div class="face" aria-hidden="${K.flip}">
      <span class="tag">${esc(KAT[p.kat]||"Eigenes Produkt")}</span>
      ${img(p)}
      <p style="font-size:20px;font-weight:700;margin:12px 0 4px">${esc(p.marke)}</p>
      <p class="muted small">Was weißt du darüber? Wirkstoff, Anwendung, Dosierung, Hinweise … Tippen zum Umdrehen.</p>
    </div>
    <div class="face back" aria-hidden="${!K.flip}" ${K.flip?`tabindex="0"`:""}>
      <p style="font-size:18px;font-weight:700;margin:0 0 10px">${esc(p.marke)}</p>
      <div class="kv"><b>Wirkstoff</b>${esc(p.wirkstoff)}${p.gruppe?` · <span class="muted">${esc(p.gruppe)}</span>`:""}</div>
      <div class="kv"><b>Anwendung</b>${esc(p.anwendung||p.kurz||"–")}</div>
      <div class="kv"><b>Dosierung</b>${esc(p.dosierung||p.dosKurz||"–")}</div>
      ${p.hinweise&&p.hinweise.length?`<div class="kv"><b>Beratungshinweise</b><ul class="clean">${p.hinweise.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>`:""}
      ${p.warum&&p.warum.length?`<div class="kv"><b>⚠️ Wann nicht – und warum?</b><ul class="clean">${p.warum.map(x=>`<li><b>${esc(x.wenn)}:</b> ${esc(x.warum)}</li>`).join("")}</ul></div>`:""}
      ${p.arzt?`<div class="kv"><b>Zum Arzt bei</b>${esc(p.arzt)}</div>`:""}
    </div>
   </div>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="btn sec" onclick="rateK(false)">🔁 Nochmal</button>
    <button class="btn" onclick="rateK(true)">✅ Kann ich</button>
  </div>
  <p class="small muted center" style="margin-top:8px">Karte ${K.i+1} von ${K.list.length} · Stufe ${lvl}/3</p>`;
}
function flipK(){K.flip=!K.flip;renderK();const f=document.querySelector(".flip");if(f)f.focus({preventScroll:true})}
function rateK(ok){const p=K.list[K.i];let l=S.cards[p.id]||0;l=ok?Math.min(3,l+1):0;S.cards[p.id]=l;save();
  if(!ok){K.list.splice(Math.min(K.list.length,K.i+4),0,p)}
  K.i++;K.flip=false;if(K.i>=K.list.length){R.karten();toast("Runde durch – neu gemischt");return}renderK();}

   <div class="card">
    <div class="kv"><b>Wirkstoff</b>${esc(p.wirkstoff)}</div>
    ${p.gruppe?`<div class="kv"><b>Gruppe</b>${esc(p.gruppe)}</div>`:""}
    <div class="kv"><b>Anwendung</b>${esc(p.anwendung||p.kurz||"–")}</div>
    <div class="kv"><b>Dosierung</b>${esc(p.dosierung||p.dosKurz||"–")}</div>
    ${p.hinweise&&p.hinweise.length?`<div class="kv"><b>Beratungshinweise</b><ul class="clean">${p.hinweise.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>`:""}
    ${p.arzt?`<div class="kv" style="margin:0"><b>Zum Arzt bei</b>${esc(p.arzt)}</div>`:""}
   </div>
   ${warumHTML(p)}
   ${eigen?`<div class="row"><button class="btn sec" onclick="editProd('${id}')">Bearbeiten</button><button class="btn ghost" style="color:var(--bad)" onclick="askDel('${id}')">Löschen</button></div>`:""}
  </div></div>`;
}
let lastFocus=null;
function warumHTML(p){
  if(!p.warum||!p.warum.length)return "";
  return `<div class="box warn"><h3>⚠️ Wann nicht – und warum?</h3>${p.warum.map(x=>`<details class="why2"><summary>${esc(x.wenn)}</summary><p>${esc(x.warum)}</p></details>`).join("")}</div>`;
}
function closeModal(){$("#modal").innerHTML="";document.body.style.overflow="";if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
new MutationObserver(()=>{const sh=document.querySelector("#modal .sheet");if(sh){if(!sh.contains(document.activeElement)){if(!lastFocus||!document.querySelector("#modal").contains(lastFocus))lastFocus=lastFocus||document.activeElement;}document.body.style.overflow="hidden";const f=sh.querySelector("button,input,[tabindex]");if(f&&!sh.contains(document.activeElement))f.focus({preventScroll:true})}}).observe(document.querySelector("#modal"),{childList:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeModal()});
document.addEventListener("focusin",e=>{if(!$("#modal").innerHTML)lastFocus=e.target},true);
function refresh(){if(tab==="produkte")R.produkte()}
function setPhoto(id,file){
  if(!file)return;const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const max=700;let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
    S.photos[id]=c.toDataURL("image/jpeg",0.72);
    if(save())toast("Foto gespeichert");openProd(id);refresh();
  };im.onerror=()=>toast("Bild konnte nicht gelesen werden");im.src=fr.result};
  fr.readAsDataURL(file);
}
function askDel(id){
  const p=prodById(id);
  $("#modal").innerHTML=`<div class="modal"><div class="sheet" role="alertdialog" aria-modal="true" aria-label="Löschen bestätigen"><h2>„${esc(p.marke)}“ löschen?</h2><p class="muted">Das Produkt und sein Foto werden entfernt.</p>
  <div class="row"><button class="btn ghost" onclick="openProd('${id}')">Abbrechen</button><button class="btn" style="background:var(--bad)" onclick="S.eigene=S.eigene.filter(e=>e.id!=='${id}');delete S.photos['${id}'];delete S.cards['${id}'];save();closeModal();refresh();toast('Gelöscht')">Löschen</button></div></div></div>`;
}
function editProd(id){
  const p=id?prodById(id):{};
  const f=(k,l,ph,ta)=>`<label class="f" for="e_${k}">${l}</label>${ta?`<textarea id="e_${k}" placeholder="${ph}">${esc(Array.isArray(p[k])?p[k].join("\n"):p[k]||"")}</textarea>`:`<input type="text" id="e_${k}" placeholder="${ph}" value="${esc(p[k]||"")}">`}`;
  $("#modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" role="dialog" aria-modal="true" aria-label="Produkt bearbeiten">
   <div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${id?"Produkt bearbeiten":"Eigenes Produkt"}</h2><button class="toggle" onclick="closeModal()" aria-label="Schließen">✕ Schließen</button></div>
   <p class="small muted">Was auf der Packung steht, reicht. Je mehr Felder ausgefüllt sind, desto mehr Quizfragen entstehen.</p>
   <form onsubmit="event.preventDefault();saveProd('${id||""}')">
   ${f("marke","Produktname *","z. B. Thomapyrin")}
   ${f("wirkstoff","Wirkstoff(e) *","z. B. ASS, Paracetamol, Coffein")}
   ${f("gruppe","Wirkstoffgruppe","z. B. Analgetikum")}
   ${f("kurz","Wofür? (kurz) *","z. B. Kopfschmerzen")}
   ${f("dosKurz","Dosierung (kurz)","z. B. 1–2 Tbl., max. 3× täglich")}
   ${f("quiz","Wichtigster Beratungshinweis","z. B. Max. 3 Tage ohne Arzt")}
   ${f("hinweise","Weitere Hinweise (eine Zeile pro Hinweis)","",true)}
   ${f("arzt","Zum Arzt bei","")}
   <button class="btn" type="submit">Speichern</button></form>
  </div></div>`;
}
function saveProd(id){
  const g=k=>($("#e_"+k).value||"").trim();
  if(!g("marke")||!g("wirkstoff")||!g("kurz")){toast("Bitte Name, Wirkstoff und „Wofür?“ ausfüllen");return}
  const obj={id:id||("e"+Date.now()),kat:"eigen",marke:g("marke"),name:g("marke"),wirkstoff:g("wirkstoff"),gruppe:g("gruppe"),kurz:g("kurz"),anwendung:g("kurz"),dosKurz:g("dosKurz"),dosierung:g("dosKurz"),quiz:g("quiz"),hinweise:g("hinweise").split("\n").map(s=>s.trim()).filter(Boolean),arzt:g("arzt")};
  if(!obj.quiz)delete obj.quiz;if(!obj.dosKurz){delete obj.dosKurz;delete obj.dosierung}if(!obj.gruppe)delete obj.gruppe;
  S.eigene=S.eigene||[];const i=S.eigene.findIndex(e=>e.id===obj.id);if(i>=0)S.eigene[i]=obj;else S.eigene.push(obj);
  save();toast("Gespeichert – jetzt noch ein Foto?");openProd(obj.id);refresh();
}

/* ============ START ============ */
const h=(location.hash||"").slice(1);
go(TABS.some(t=>t[0]===h)?h:"start");
window.addEventListener("hashchange",()=>{const x=location.hash.slice(1);if(x!==tab&&TABS.some(t=>t[0]===x))go(x)});
</script>
</body>
</html>
